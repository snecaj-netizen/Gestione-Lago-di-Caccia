    <script>
      // Global error handler to suppress benign cross-origin script errors and iframe sandbox violations
      (function() {
        // A helper to detect if an error/message is one of our benign cross-origin/sandbox errors
        function isBenignError(message, error) {
          try {
            var msg = (message || '').toString().toLowerCase();
            return msg.indexOf('script error') > -1 || 
                msg.indexOf('access is denied') > -1 || 
                msg.indexOf('localstorage') > -1 || 
                msg.indexOf('securityerror') > -1 ||
                msg.indexOf('could not reach cloud firestore backend') > -1 ||
                msg.indexOf('firestore (12.12.0)') > -1 ||
                msg.indexOf('operating in offline mode') > -1;
          } catch (e) {
            return false;
          }
        }

        // Overwrite console.error to filter out benign cross-origin / sandbox errors
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var argStr = args.map(function(arg) {
            try {
              return arg ? (arg.message || arg.toString()) : '';
            } catch(e) {
              return '';
            }
          }).join(' ');
          
          if (isBenignError(argStr, null)) {
            console.warn('Console interception: Silenced benign cross-origin or sandbox error:', argStr);
            return;
          }
          return originalConsoleError.apply(console, arguments);
        };

        // Initialize early direct onerror handler
        var originalOnError = window.onerror;
        var currentOnError = function(message, source, lineno, colno, error) {
          if (isBenignError(message, error)) {
            console.warn('Interception (early): Silenced cross-origin error in window.onerror:', message);
            return true; // prevent default
          }
          if (originalOnError) {
            return originalOnError(message, source, lineno, colno, error);
          }
          return false;
        };
        window.onerror = currentOnError;

        // Intercept and wrap any later setter for window.onerror
        Object.defineProperty(window, 'onerror', {
          get: function() {
            return currentOnError;
          },
          set: function(handler) {
            if (typeof handler === 'function') {
              currentOnError = function(message, source, lineno, colno, error) {
                if (isBenignError(message, error)) {
                  console.warn('Interception (set): Silenced cross-origin error in window.onerror:', message);
                  return true; // prevent default
                }
                return handler(message, source, lineno, colno, error);
              };
            } else {
              currentOnError = null;
            }
          },
          configurable: true,
          enumerable: true
        });

        // Intercept and wrap window.addEventListener & EventTarget.prototype.addEventListener
        var originalAddEventListener = window.addEventListener;
        var originalProtoAddEventListener = EventTarget.prototype.addEventListener;

        function wrapAddEventListener(original) {
          return function(type, listener, options) {
            if ((type === 'error' || type === 'unhandledrejection') && typeof listener === 'function') {
              var wrappedListener = function(event) {
                var message = event.message || '';
                var error = event.error || event.reason || null;
                if (isBenignError(message, error)) {
                  console.warn('Interception: Silenced cross-origin error in addEventListener (' + type + '):', message || error);
                  try {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation();
                  } catch (e) {}
                  return;
                }
                return listener.apply(this, arguments);
              };
              // Keep reference to wrapped listener for removeEventListener compatibility
              if (!listener.__wrappedListeners) {
                listener.__wrappedListeners = [];
              }
              listener.__wrappedListeners.push({ original: listener, wrapped: wrappedListener, type: type });
              return original.call(this, type, wrappedListener, options);
            }
            return original.apply(this, arguments);
          };
        }

        window.addEventListener = wrapAddEventListener(originalAddEventListener);
        if (typeof EventTarget !== 'undefined' && EventTarget.prototype) {
          EventTarget.prototype.addEventListener = wrapAddEventListener(originalProtoAddEventListener);
        }

        // Also wrap removeEventListener so it works properly
        var originalRemoveEventListener = window.removeEventListener;
        var originalProtoRemoveEventListener = (typeof EventTarget !== 'undefined' && EventTarget.prototype) ? EventTarget.prototype.removeEventListener : null;

        function wrapRemoveEventListener(original) {
          return function(type, listener, options) {
            if ((type === 'error' || type === 'unhandledrejection') && typeof listener === 'function' && listener.__wrappedListeners) {
              for (var i = 0; i < listener.__wrappedListeners.length; i++) {
                var record = listener.__wrappedListeners[i];
                if (record.type === type) {
                  original.call(this, type, record.wrapped, options);
                }
              }
            }
            return original.apply(this, arguments);
          };
        }

        window.removeEventListener = wrapRemoveEventListener(originalRemoveEventListener);
        if (originalProtoRemoveEventListener) {
          EventTarget.prototype.removeEventListener = wrapRemoveEventListener(originalProtoRemoveEventListener);
        }

        // Register our own early handler as well, just in case
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          if (isBenignError(msg, event.error)) {
            try {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
            } catch (e) {}
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event.reason && event.reason.message) ? event.reason.message.toString() : '';
          if (isBenignError(msg, event.reason)) {
            try {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
            } catch (e) {}
          }
        }, true);
      })();
